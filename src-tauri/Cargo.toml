[package]
name = "exotica-decollage"
version = "1.0.0"
description = "Generative plunderphonics & musique concrète studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
# fat LTO ("true") intermittently crashes rustc on this machine
# (STATUS_STACK_BUFFER_OVERRUN); thin is stable and nearly as small
lto = "thin"
