name: build-apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app (universal)
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Exotica-Decollage-macOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

      - name: Commit dmg back to the repo
        run: |
          mkdir -p release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "release/Exotica-Decollage-macOS.dmg"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release
          git commit -m "macOS build ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  build-windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app (NSIS installer)
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Exotica-Decollage-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Commit installer back to the repo
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe "release/Exotica-Decollage-Setup.exe"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release
          git commit -m "Windows build ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
